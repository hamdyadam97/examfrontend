name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # /api is proxied to the backend by nginx on the server, so the site
      # talks to the API on the same origin (no CORS, no mixed content).
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build to the server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SERVER_PORT || 22 }}" \
            dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/examfrontend/"
